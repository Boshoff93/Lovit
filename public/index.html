    <style>
      /* These styles paint the loader while the app bundle is still downloading. */
      #gruvi-startup:not([hidden]) {
        --orbit-radius: clamp(68px, 22vmin, 104px);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #142c33 0, #10171d 320px);
      }

      #gruvi-startup:not([hidden]) ~ #root {
        visibility: hidden;
      }

      .gruvi-startup-logo {
        grid-area: 1 / 1;
        width: clamp(64px, 20vmin, 100px);
        height: auto;
        filter: drop-shadow(0 8px 22px #55dcc930);
      }

      .gruvi-startup-orbit {
        grid-area: 1 / 1;
        position: relative;
        box-sizing: border-box;
        width: calc(2 * var(--orbit-radius));
        aspect-ratio: 1;
        border: 1px solid #9ae9e426;
        border-radius: 50%;
        animation: gruvi-startup-spin 18s linear infinite;
      }

      .gruvi-startup-icon {
        position: absolute;
        top: calc(50% + var(--y) * var(--orbit-radius));
        left: calc(50% + var(--x) * var(--orbit-radius));
        translate: -50% -50%;
        box-sizing: border-box;
        width: clamp(30px, 8vmin, 42px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        color: var(--brand);
        background: #1b2a32;
        border: 1px solid #b4dce529;
        border-radius: 50%;
        box-shadow: 0 4px 12px #0a121a80;
        animation: gruvi-startup-spin 18s linear infinite reverse;
      }

      .gruvi-startup-icon svg {
        width: 52%;
        height: 52%;
        fill: currentColor;
      }

      @keyframes gruvi-startup-spin {
        to { transform: rotate(1turn); }
      }

      @media (prefers-reduced-motion: reduce) {
        .gruvi-startup-orbit,
        .gruvi-startup-icon {
          animation: none;
        }
      }
    </style>
  </head>
